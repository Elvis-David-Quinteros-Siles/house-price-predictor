# CI/CD del House Price Predictor.
#   1. tests:  pruebas unitarias del pipeline de datos y features.
#   2. build:  construye la imagen de la API (entrena el modelo en el build),
#              aplica la puerta de calidad, arranca la API y la prueba como un
#              cliente; construye también la imagen de Streamlit.
#   3. En push a main publica ambas imágenes en GitHub Container Registry.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            src/api/requirements.txt
            tests/requirements.txt

      - name: Install dependencies
        run: pip install -r src/api/requirements.txt -r tests/requirements.txt

      - name: Run unit tests
        run: python -m pytest -v tests/unit

  build:
    name: Build, quality gate and API tests
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: docker/setup-buildx-action@v3

      - name: Build API image (trains the model)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/api/Dockerfile
          tags: house-price-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Quality gate
        run: |
          pip install pyyaml==6.0.2
          docker create --name model-artifacts house-price-api:ci
          docker cp model-artifacts:/app/models/trained/model_metadata.json model_metadata.json
          docker rm model-artifacts
          cat model_metadata.json
          python scripts/check_quality_gate.py model_metadata.json configs/model_config.yaml

      - name: Start API
        run: |
          docker run -d --name api -p 8000:8000 house-price-api:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1

      - name: API tests
        env:
          API_URL: http://localhost:8000
        run: |
          pip install -r tests/requirements.txt
          python -m pytest -v tests/api

      - name: API logs
        if: always()
        run: docker logs api || true

      - name: Build Streamlit image
        uses: docker/build-push-action@v6
        with:
          context: streamlit_app
          tags: house-price-predictor:ci
          load: true
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      - name: Publish images to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ghcr exige el nombre del dueño en minúsculas.
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in house-price-api house-price-predictor; do
            for tag in "${GITHUB_SHA::7}" latest; do
              docker tag "$image:ci" "$registry/$image:$tag"
              docker push "$registry/$image:$tag"
            done
          done
