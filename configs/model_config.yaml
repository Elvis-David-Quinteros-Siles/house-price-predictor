# Modelo final. Elegido con validación cruzada de 5 folds sobre King County
# (21.418 ventas tras la limpieza).
#
# 1) Algoritmo, con las 6 entradas originales (zipcode como ubicación):
#   Baseline mediana       R² -0.06  MAE $221.7k
#   LinearRegression       R²  0.75  MAE $108.7k
#   GB 100 árboles prof. 3 R²  0.74  MAE $115.9k
#   RandomForest 300       R²  0.74  MAE  $98.3k
#   GB 600 prof. 5         R²  0.78  MAE  $90.3k
#   GB 600 prof. 5 + log   R²  0.80  MAE  $87.0k
#
# 2) Variables, con ese algoritmo:
#   6 entradas, zipcode                          R² 0.795  MAE $87.1k  MAPE 15.4%
#   + grade, view, waterfront, sqft_lot, zipcode R² 0.871  MAE $72.7k  MAPE 13.4%
#   + las mismas, lat/long                       R² 0.895  MAE $64.9k  MAPE 11.9%
#   + las mismas, lat/long + zipcode             R² 0.897  MAE $63.5k  MAPE 11.7%  (dentro del ruido)
#
# 3) Con las entradas de la API (lat/long, sin zipcode), octubre 2026:
#   GradientBoosting 600 prof. 5                 R² 0.894  MAE $65.6k  MAPE 12.1%
#   HistGradientBoosting                         R² 0.890  MAE $65.4k  MAPE 12.1%
#   XGBoost 2000                                 R² 0.899  MAE $63.7k  MAPE 11.8%
#   LightGBM 2000                                R² 0.900  MAE $62.6k  MAPE 11.6%
#   LightGBM + mes de venta + 10 vecinos         R² 0.907  MAE $59.9k  MAPE 11.2%  <- elegido
#   (con floors, sótano y año de reforma bajaría a $58.6k, pero la API tendría
#   que pedir esos datos; sqft_living15/sqft_lot15 no aportan sobre los vecinos.)
#   Hiperparámetros: Optuna, 44 pruebas, MAE CV $59.8k (a mano: $59.9k).
# Las métricas del modelo entrenado se escriben en models/trained/model_metadata.json.
model:
  name: house_price_model
  best_model: LightGBM
  target_variable: price
  # Entrena sobre log(price): los precios están muy sesgados ($75k-$7.7M).
  # Obligatorio: las variables de vecinos usan el precio en log.
  log_target: true
  # Ventas más cercanas cuyo precio describe el barrio (src/features/engineer.py).
  neighbours: 10
  dataset: King County House Sales 2014-2015 (Kaggle, CC0)
  parameters:
    n_estimators: 1300
    learning_rate: 0.013
    num_leaves: 75
    min_child_samples: 12
    subsample: 0.77
    subsample_freq: 1
    colsample_bytree: 0.7
    # Importancia por ganancia (la de serie cuenta divisiones), para /model-info.
    importance_type: gain
    random_state: 42
    verbose: -1

# Mínimos que debe cumplir el modelo en test para publicarse (CI).
# Modelo actual: R² 0.907, MAE $61.5k, MAPE 11.1 %.
quality_gate:
  min_r2: 0.895
  max_mae: 65000
  max_mape: 0.12

# Además de la puerta, el challenger tiene que aguantar contra el champion en
# producción, las dos versiones sobre el mismo test (scripts/promote_model.py).
# Gana si su MAE no supera el del champion en más de este margen relativo
# (1 % ≈ $600): con datos más recientes, un empate dentro del ruido promueve.
champion_challenger:
  max_mae_increase: 0.01

# Error real (scripts/production_performance.py): al publicarse un mes de
# ventas, el @champion tasa esas casas, que no vio, antes de reentrenar.
# Está degradado si su MAPE supera el de su test en más de max_mape_increase
# (relativo) o si tasa sistemáticamente por encima o por debajo del mercado
# (|sesgo| > max_abs_bias), con al menos min_sales ventas: con menos, ruido.
# v4 (ventas hasta 2015-02, MAPE de test 10.8 %) sin reentrenar:
#   2015-03  MAPE 11.9 %  sesgo -3.5 %
#   2015-04  MAPE 12.3 %  sesgo -5.8 %   <- degradado (sesgo)
#   2015-05  MAPE 13.3 %  sesgo -6.6 %   <- degradado (MAPE y sesgo)
production_performance:
  max_mape_increase: 0.15
  max_abs_bias: 0.05
  min_sales: 200

# Contrato del dataset antes de entrenar (src/data/validate_data.py). Si no
# se cumple, el ciclo para: un modelo entrenado con datos rotos puede pasar
# la puerta de calidad, porque su test está igual de roto.
# Rangos: los que acepta la API (src/api/schemas.py) y, para precio y
# superficies, holgados sobre King County (precio $75k-$7.7M, sqft 290-13.540).
# La mediana mensual del precio varió entre -9 % y +8 % en 2014-2015.
data_validation:
  ranges:
    price: [50000, 20000000]
    sqft_living: [200, 20000]
    sqft_lot: [100, 5000000]
    yr_built: [1900, 2015]
    condition: [1, 5]
    grade: [1, 13]
    view: [0, 4]
    waterfront: [0, 1]
    lat: [47.1, 47.8]
    long: [-122.6, -121.3]
  # run_processing.py descarta 18 de 21.613 filas (0,08 %).
  max_dropped_share: 0.01
  min_month_sales: 300
  max_median_price_shift: 0.25
